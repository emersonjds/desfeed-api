services:
  postgres:
    image: postgres:16-alpine
    container_name: desfeed-postgres
    environment:
      POSTGRES_USER: desfeed
      POSTGRES_PASSWORD: desfeed
      POSTGRES_DB: desfeed
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - desfeed-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U desfeed -d desfeed']
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: .
    container_name: desfeed-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://desfeed:desfeed@postgres:5432/desfeed
    ports:
      - '${API_PORT:-3000}:3000'

volumes:
  desfeed-pgdata:
